# Collector that forwards the telemetry of the broker to Jaeger, so that the broker spans appear in the same traces
# as the spans of the hub. The hub exports its own spans straight to Jaeger and does not pass through here.
#
# The receiver of the broker speaks AMQP, not SMF, and binds to the queue that the telemetry profile provisioned by
# the Gradle build creates. Both the telemetry profile name and the receiver credentials are fixed by that build
# (see integration-tests/build.gradle).
receivers:
  solace:
    broker: ['solace:5672']
    queue: 'queue://#telemetry-trace'
    auth:
      sasl_plain:
        username: 'telemetry-receiver'
        password: 'telemetry-receiver'
    tls:
      insecure: true
      insecure_skip_verify: true

processors:
  # The broker reports itself under the host name of its container, which is a different, generated value on every
  # run. Naming it here is what lets a test assert on the broker spans by service name.
  resource:
    attributes:
      - key: 'service.name'
        value: 'solace-broker'
        action: 'upsert'

exporters:
  otlp:
    endpoint: 'jaeger:4317'
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: '0.0.0.0:13133'

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [solace]
      processors: [resource]
      exporters: [otlp]
  telemetry:
    logs:
      level: warn
